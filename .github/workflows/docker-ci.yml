
name: Norie Fashion Website CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image for testing
        run: docker build -t noire-fashion-web:ci .

      - name: Start test container
        run: docker run -d --name noire-test -p 3000:3000 noire-fashion-web:ci

      - name: Test website response
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:3000/; then
              echo "Website test passed"
              exit 0
            fi
            sleep 2
          done
          docker logs noire-test
          exit 1

      - name: Clean up test container
        if: always()
        run: docker rm -f noire-test || true

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/priscilanna/noire-fashion-website:latest
            ghcr.io/priscilanna/noire-fashion-website:${{ github.sha }}
